name: Deploy Coven to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'Scripts/browser_smoke.mjs'
      - 'Scripts/build_browser.mjs'
      - 'server/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build standalone site
        run: npm run build
        env:
          # Set the repository variable COVEN_SERVER to your multiplayer server's address.
          COVEN_SERVER: ${{ vars.COVEN_SERVER }}
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
